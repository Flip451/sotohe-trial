[graph]
targets = []
all-features = false
no-default-features = false
exclude-dev = true

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "BSD-3-Clause",
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
skip = [
]

# Enforce layered architecture boundaries for this template workspace.
# Crate names can be changed, but wrappers must reflect your composition root.
deny = [
    { crate = "frameworks", wrappers = ["web_composition"], reason = "Frameworks provide persistence, cryptography, and server-runtime adapters." },
    { crate = "use_cases", wrappers = ["web_composition", "interface_adapters", "frameworks"], reason = "Use_cases crate must only be consumed by the outer layers." },
    { crate = "entities", wrappers = ["web_composition", "frameworks", "use_cases"], reason = "Entities dependencies are controlled by layer boundaries." },
    { crate = "web_composition", wrappers = ["web"], reason = "Web composition owns the complete object graph and server assembly." },
    { crate = "interface_adapters", wrappers = ["web", "web_composition"], reason = "Interface adapters translate delivery inputs and invoke use-case ports." },
]
